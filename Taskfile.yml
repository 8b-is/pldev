version: '3'

vars:
  PKG: github.com/peterlodri-sec/pldev/internal/buildinfo
  VERSION:
    sh: git describe --tags --always --dirty 2>/dev/null || echo dev
  COMMIT:
    sh: git rev-parse --short HEAD 2>/dev/null || echo none
  DATE:
    sh: git log -1 --format=%cI 2>/dev/null || echo unknown
  LDFLAGS: >-
    -X {{.PKG}}.Version={{.VERSION}}
    -X {{.PKG}}.Commit={{.COMMIT}}
    -X {{.PKG}}.Date={{.DATE}}

tasks:
  build:
    cmds: ['go build -ldflags "{{.LDFLAGS}}" -o pldev .']
  install:
    cmds: ['go build -ldflags "{{.LDFLAGS}}" -o "{{.HOME}}/.local/bin/pldev" .']
    env: { HOME: '{{.HOME}}' }
  test:
    cmds: ['go test ./...']
  lint:
    cmds: ['go vet ./...']
  version:
    desc: Build and print embedded build info
    cmds:
      - go build -ldflags "{{.LDFLAGS}}" -o pldev .
      - ./pldev --version
  cross:
    cmds:
      - GOOS=darwin GOARCH=arm64 go build -ldflags "{{.LDFLAGS}}" -o dist/pldev-darwin-arm64 .
      - GOOS=darwin GOARCH=amd64 go build -ldflags "{{.LDFLAGS}}" -o dist/pldev-darwin-amd64 .
      - GOOS=linux  GOARCH=arm64 go build -ldflags "{{.LDFLAGS}}" -o dist/pldev-linux-arm64 .
      - GOOS=linux  GOARCH=amd64 go build -ldflags "{{.LDFLAGS}}" -o dist/pldev-linux-amd64 .

  sign:
    desc: 'SSH-sign a binary (no transparency log; reuses your ssh key). Usage: task sign BIN=dist/pldev-darwin-arm64 [KEY=~/.ssh/id_ed25519]'
    requires: { vars: [BIN] }
    vars:
      KEY: '{{.KEY | default "~/.ssh/id_ed25519"}}'
    cmds:
      # ssh-keygen prompts for the key passphrase (or uses ssh-agent); no secret on the CLI.
      - ssh-keygen -Y sign -n pldev -f {{.KEY}} "{{.BIN}}"
      - 'echo "signed: {{.BIN}}.sig — verify with: pldev verify {{.BIN}}"'

  pq-keygen:
    desc: 'Generate the ML-DSA-65 release key (prints the pq_signers line; never prints the private key).'
    cmds:
      - go run . pq-keygen

  pq-sign:
    desc: 'PQ-sign a binary. Usage: task pq-sign BIN=dist/pldev-darwin-arm64 KEY=~/.config/pldev/keys/brett-shaw_mldsa.key'
    requires: { vars: [BIN, KEY] }
    cmds:
      - go run . pq-sign -key {{.KEY}} "{{.BIN}}"
      - 'echo "pq-signed: {{.BIN}}.sig.mldsa"'
