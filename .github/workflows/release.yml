name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write   # create the GitHub Release; no id-token (key-based, not keyless)

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-go@v5
        with: { go-version: '1.26' }
      - uses: sigstore/cosign-installer@v3

      - name: Build + sign (key-based, no transparency log)
        env:
          COSIGN_KEY: ${{ secrets.COSIGN_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          set -euo pipefail
          PKG=github.com/peterlodri-sec/pldev/internal/buildinfo
          LD="-X $PKG.Version=$(git describe --tags --always --dirty) \
              -X $PKG.Commit=$(git rev-parse --short HEAD) \
              -X $PKG.Date=$(git log -1 --format=%cI)"
          mkdir -p dist
          for t in darwin/arm64 darwin/amd64 linux/arm64 linux/amd64; do
            os=${t%/*}; arch=${t#*/}; out=dist/pldev-$os-$arch
            GOOS=$os GOARCH=$arch go build -ldflags "$LD" -o "$out" .
            cosign sign-blob --key env://COSIGN_KEY --tlog-upload=false --yes \
              --output-signature "$out.sig" "$out"
          done

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "$GITHUB_REF_NAME" \
            --notes "Key-based signed release (no public log). Verify a downloaded binary with an already-trusted pldev: \`pldev verify <binary>\` (binary #1: bootstrap once with raw cosign + cosign.pub)."
